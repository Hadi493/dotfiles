[colors]
bg        = #181818
bg-1      = #0d0d0d
surface0  = #1c1c2a
surface1  = #2a2a3e
surface2  = #363652
gray      = #6B7B8E
dim       = #3d4658
gold      = #E6B450
blue      = #6DCFFF
green     = #C5E665
red       = #FF7B85
peach     = #FFA375
purple    = #E0B8FF
teal      = #A8F0D8
cyan      = #4AC8E6

[bar/toph]
monitor = HDMI2
height = 30px
radius = 0
dpi = 75

background = ${colors.bg}
foreground = ${colors.gold}

line-size = 0pt
border-size = 0px

padding-left = 0
padding-right = 1
module-margin = 1

font-0 = JetBrainsMonoNL Nerd Font:size=15

modules-left = xworkspaces xwindow
modules-center = date
modules-right = microphone-input pulseaudio battery cpu memory uptime systray

cursor-click = pointer
cursor-scroll = ns-resize
enable-ipc = true
wm-restack = i3
override-redirect = false

[module/systray]
type = internal/tray
format-margin = 0pt
tray-spacing = 1pt
tray-padding = 1pt
tray-size = 66%
tray-background = ${colors.bg}

[module/xworkspaces]
type = internal/xworkspaces

label-active = %name%
label-active-background = ${colors.gold}
label-active-foreground = ${colors.bg-1}
label-active-padding = 1

label-occupied = %name%
label-occupied-padding = 1

label-urgent = %name%
label-urgent-background = ${colors.red}
label-urgent-padding = 1

label-empty = %name%
label-empty-foreground = ${colors.gray}
label-empty-padding = 1

[module/xwindow]
type = internal/xwindow
label = %title:0:10:...%

[module/pulseaudio]
type = internal/pulseaudio

format-volume-prefix = "VOL: "
format-volume-prefix-foreground = ${colors.peach}
format-volume = <label-volume>
label-volume = %percentage%%
label-volume-foreground = ${colors.peach}

label-muted = muted
label-muted-foreground = ${colors.red}

[module/microphone-input]
type = custom/script
exec = ~/.config/polybar/mic-input.sh
interval = 2

format-prefix = "MIC:"
format-prefix-foreground = ${colors.purple}
label = %output%
label-foreground = ${colors.purple}

click-left = pactl set-source-mute @DEFAULT_SOURCE@ toggle
scroll-up = pactl set-source-volume @DEFAULT_SOURCE@ +5%
scroll-down = pactl set-source-volume @DEFAULT_SOURCE@ -5%

[module/memory]
type = internal/memory
interval = 2
format-prefix = "RAM: "
format-prefix-foreground = ${colors.purple}
label = %percentage_used:2%%
label-foreground = ${colors.purple}

[module/cpu]
type = internal/cpu
interval = 2
format-prefix = "CPU: "
format-prefix-foreground = ${colors.green}
label = %percentage:2%%
label-foreground = ${colors.green}

[module/battery]
type = internal/battery
battery = BAT0
adapter = AC
full-at = 98
low-at = 20
poll-interval = 5

format-charging = <animation-charging> <label-charging>
format-discharging = <ramp-capacity> <label-discharging>
format-full = <label-full>
format-low = <animation-low> <label-low>

label-charging = %percentage%%
label-charging-foreground = ${colors.green}
label-discharging = %percentage%%
label-discharging-foreground = ${colors.blue}
label-full =   %percentage%%
label-full-foreground = ${colors.blue}
label-low =   %percentage%%
label-low-foreground = ${colors.red}

animation-charging-0 =  
animation-charging-1 =  
animation-charging-2 =  
animation-charging-3 =  
animation-charging-4 =  
animation-charging-foreground = ${colors.green}
animation-charging-framerate = 750

ramp-capacity-0 = 
ramp-capacity-1 = 
ramp-capacity-2 = 
ramp-capacity-3 = 
ramp-capacity-4 = 
ramp-capacity-foreground = ${colors.blue}

animation-low-0 = 
animation-low-1 = 
animation-low-0-foreground = ${colors.red}
animation-low-1-foreground = ${colors.red}
animation-low-framerate = 200

[module/uptime]
type = custom/script
exec = awk '{printf "%dh %dm", int($1/3600), int($1%3600/60)}' /proc/uptime
interval = 60
format-prefix = "UpT: "
format-prefix-foreground = ${colors.teal}
label = %output%
label-foreground = ${colors.teal}

[module/date]
type = internal/date
interval = 1

date = %I:%M:%S %p | %d,%m,%a

label = %date%
label-foreground = ${colors.gold}

[settings]
screenchange-reload = true
pseudo-transparency = true

; vim:ft=dosini
