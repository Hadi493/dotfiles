# Session environment, read by the systemd user manager at login.
#
# Hyprland sets these from env.lua; niri has no such hook, so anything it spawns
# ran without them. $HOME expands here, so one file serves every user.
#
# Compositor-specific values (backend ABI hints, HYPRCURSOR_*) stay in env.lua.

XCURSOR_THEME=Bibata-Modern-Ice
XCURSOR_SIZE=24

PATH=$HOME/.local/bin:/usr/local/bin:/usr/bin:/bin

QT_QPA_PLATFORMTHEME=qt6ct

GDK_BACKEND=wayland,x11,*
QT_QPA_PLATFORM=wayland;xcb
QT_AUTO_SCREEN_SCALE_FACTOR=1
QT_WAYLAND_DISABLE_WINDOWDECORATION=1
ELECTRON_OZONE_PLATFORM_HINT=auto

# GTK4's default renderer needs Mutter's ServiceChannel and hangs on wlroots.
GSK_RENDERER=gl

EDITOR=nvim
VISUAL=nvim
