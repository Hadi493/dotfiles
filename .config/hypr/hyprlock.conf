background {
    monitor =
    path = $HOME/dotfiles/.config/hypr/images/hyprlock.jpg
    blur_passes = 2
    contrast = 0.85
    brightness = 0.75
    vibrancy = 1.0
    vibrancy_darkness = 1.0
}

general {
    hide_cursor = false
}

image {
    monitor =
    path = $HOME/dotfiles/.config/hypr/images/Arch Linux.png
    border_size = 0
    border_color = rgba(230, 180, 80, 0.6)
    size = 200
    rounding = 1
    rotate = 0
    reload_time = -1
    reload_cmd =
    position = 0, 300
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%I:%M %p")"
    color = rgb(230, 180, 80)
    font_size = 80
    font_family = Iosevka SS04
    position = 0, 120
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] echo "$(LC_TIME=en_US.UTF-8 date +"%A, %B %d")"
    color = rgba(255, 255, 255, 0.9)
    font_size = 24
    font_family = Iosevka SS04
    position = 0, 20
    halign = center
    valign = center
}

label {
    monitor =
    text = $USER
    color = rgba(255, 255, 255, 0.85)
    font_size = 17
    font_family = Iosevka SS04
    position = 0, -50
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 280, 50
    outline_thickness = 2
    dots_size = 0.2
    dots_spacing = 0.2
    dots_center = true
    outer_color = rgba(230, 180, 80, 0.9)
    inner_color = rgba(28, 28, 42, 0.65)
    font_color = rgb(255, 255, 255)
    fade_on_empty = false
    font_family = Iosevka SS04
    placeholder_text = <i>Enter password</i>
    hide_input = false
    position = 0, -115
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] echo "$(~/dotfiles/.config/hypr/scripts/songdetail.sh)"
    color = rgba(107, 123, 142, 0.9)
    font_size = 14
    font_family = Iosevka SS04
    position = 0, -195
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:5000] echo "$(uptime -p)"
    color = rgba(107, 123, 142, 0.95)
    font_size = 13
    font_family = Iosevka SS04
    position = 0, -235
    halign = center
    valign = center
}
