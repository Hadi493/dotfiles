# ------------------------------------------------------------------
# Hyprland Animations - classical & optimized
# ------------------------------------------------------------------
# Toggle all animations on/off with $enable_animations in variables.conf.
# Dynamic toggle at runtime: use the keybind (SUPER + CTRL + A) or run:
#   hyprctl keyword animations:enabled true|false
# ------------------------------------------------------------------

animations {
    enabled = $enable_animations

    # ---- Beziers (easing curves) ----
    bezier = wind, 0.05, 0.9, 0.1, 1.05
    bezier = winIn, 0.1, 1.1, 0.1, 1.1
    bezier = winOut, 0.3, -0.3, 0, 1
    bezier = smooth, 0.04, 0.93, 0.12, 1.02

    # ---- Window animations ----
    animation = windows, 1, 5, wind, slide
    animation = windowsIn, 1, 5, winIn, slide
    animation = windowsOut, 1, 3, winOut, slide
    animation = windowsMove, 1, 4, wind

    # ---- Fade ----
    animation = fade, 1, 3, default
    animation = fadeDim, 1, 3, default

    # ---- Workspaces ----
    animation = workspaces, 1, 4, smooth, slidevert
}
