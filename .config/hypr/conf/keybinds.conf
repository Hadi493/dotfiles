###################
### KEYBINDINGS ###
###################


# Audio — Shima owns the OSD: `audio ...` changes the PipeWire sink and the
# bar OSD flashes on that change. F10 / XF86AudioMicMute toggle the USB mic via
# input-mute-toggle. bindel = repeat on hold + works on lockscreen.
bindel = , XF86AudioRaiseVolume, exec, qs -c shell ipc call audio volumeUp
bindel = , XF86AudioLowerVolume, exec, qs -c shell ipc call audio volumeDown
bindl = , XF86AudioMute, exec, qs -c shell ipc call audio mute
bindl = , XF86AudioMicMute, exec, $HOME/.config/hypr/scripts/input-mute-toggle

# See https://wiki.hypr.land/Configuring/Keywords/
$mainMod = SUPER # Sets "Windows" key as main modifier

# Example binds, see https://wiki.hypr.land/Configuring/Binds/ for more
bind = ALT, Q, exec, $quran
bind = $mainMod, Return, exec, $herdr
bind = $mainMod SHIFT, Return, exec, $terminal
bind = $mainMod, Q, killactive,
bind = $mainMod SHIFT, M, exit,
bind = $mainMod, A, exec, $audiosettings
bind = ALT, A, exec, kitty --title alsamixer alsamixer # hardware mic/volume levels
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, Space, togglefloating,
bind = $mainMod, D, global, ryoku:launcher
bind = $mainMod SHIFT, D, exec, $discord
bind = ALT SHIFT, D, exec, $discord-web
bind = CTRL SHIFT, D, exec, $discord-web2
bind = ALT, T, exec, $telegram
bind = ALT, R, exec, $reddit
bind = $mainMod SHIFT, A, exec, $tmenu
bind = ALT, F, exec, $facebook
bind = $mainMod SHIFT, W, exec, $whatsapp
bind = $mainMod, Y, exec, $yt
bind = $mainMod, T, exec, $twitch
bind = $mainMod, B, exec, brave-origin
bind = $mainMod, P, exec, ryoku-cmd-color-picker
bind = $mainMod, U, exec, ~/.config/hypr/scripts/url_launcher_gui.py
# bind = $mainMod, J, togglesplit, # dwindle
bind = SUPER, F, fullscreen

bind = $mainMod, L, exec, hyprlock

bind = $mainMod, N, global, ryoku:quicksettings
bind = $mainMod, I, exec, ~/.config/hypr/scripts/ryoku-dnd-toggle # do-not-disturb toggle
bind = $mainMod, J, global, ryoku:quicksettings

bind = $mainMod, C, exec, $codeditor

# CLock
bind = ALT, C, exec, kitty peaclock

# Grouped (tabbed) layout
bind = $mainMod, G, togglegroup

# switch windows in tab group
bind = $mainMod SHIFT, left, changegroupactive, b
bind = $mainMod SHIFT, right, changegroupactive, f
bind = ALT, Tab, global, ryoku:switcher # window switcher (MRU)
bind = ALT SHIFT, Tab, global, ryoku:switcher-prev # window switcher (MRU, backwards)

bind = $mainMod, Z, exec, coomer


# Clipboard
bind = SUPER, V, global, ryoku:clipboard

# Screen recording toggle
bind = $mainMod, R, exec, ~/.config/hypr/scripts/toggle_recording

# timer
bind = $mainMod, t, exec, cg-timer

# Direct Power Controls
bind = $mainMod SHIFT, R, exec, hyprctl --batch "reload ; keyword general:layout scrolling" ; ~/.config/hypr/scripts/hotcorner &
bind = $mainMod SHIFT, P, exec, systemctl poweroff

bind = ALT, R, exec, hyprctl keyword decoration:rounding 20

# Quick System Controls
bind = $mainMod, M, exec, qs -c shell ipc call audio mute

# wallpaper
bind = $mainMod, W, exec, $wallpaper_selector

# Ryoku Shot: capture, annotate, beautify, OCR/search/record
bind = $mainMod, PRINT, exec, ryoku-cmd-ryoshot
bind = , PRINT, exec, ryoku-cmd-ryoshot
bind = SHIFT, PRINT, exec, env RYOSHOT_MODE=monitor ryoku-cmd-ryoshot

bind = Ctrl, Escape, global, ryoku:barToggle # toggle bar
bind = $mainMod SHIFT, G, exec, ~/.config/hypr/scripts/toggle_gaps # toggle window gaps
bind = SUPER, ESCAPE, exec, qs -c shell ipc call globalActions run open-session

# Focus navigation (wraps first↔last in scrolling layout)
bind = $mainMod, left, layoutmsg, focus l
bind = $mainMod, right, layoutmsg, focus r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Move windows with mainMod + SHIFT + arrow keys
bind = $mainMod SHIFT, left, movewindow, l
bind = $mainMod SHIFT, right, movewindow, r
bind = $mainMod SHIFT, up, layoutmsg, focus u
bind = $mainMod SHIFT, down, layoutmsg, focus d

# Scrolling layout keybindings
bind = $mainMod, period, layoutmsg, move +col
bind = $mainMod, comma, layoutmsg, move -col
bind = $mainMod SHIFT, period, layoutmsg, swapcol r
bind = $mainMod SHIFT, comma, layoutmsg, swapcol l
bind = $mainMod SHIFT, bracketright, layoutmsg, promote
bind = $mainMod ALT, period, layoutmsg, colresize +conf
bind = $mainMod ALT, comma, layoutmsg, colresize -conf
bind = $mainMod, backslash, layoutmsg, fit active

# Resize windows with mainMod + CTRL + arrow keys
bind = $mainMod CTRL, left, resizeactive, -20 0
bind = $mainMod CTRL, right, resizeactive, 20 0
bind = $mainMod CTRL, up, resizeactive, 0 -20
bind = $mainMod CTRL, down, resizeactive, 0 20

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Switch workspaces with mainMod + arrow keys
bind = $mainMod, down, workspace, e+1
bind = $mainMod, up, workspace, e-1
bind = $mainMod, Tab, global, ryoku:overview # workspace overview (expo); steps while open
bind = $mainMod SHIFT, Tab, global, ryoku:overview-prev # step the overview selection backwards
bind = $mainMod, S, exec, ~/opt/squashfs-root/AppRun # session app

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Session app
bind = ALT, S, exec, ~/opt/squashfs-root/AppRun

# Touchpad swipe gestures for workspace switching (niri-like)
bind = , swipe:3:left, workspace, e+1
bind = , swipe:3:right, workspace, e-1

# Scroll through columns with mainMod + scroll (niri-like)
bind = $mainMod, mouse_down, layoutmsg, move +col
bind = $mainMod, mouse_up, layoutmsg, move -col
bind = $mainMod SHIFT, mouse_down, layoutmsg, swapcol r
bind = $mainMod SHIFT, mouse_up, layoutmsg, swapcol l
bind = $mainMod CTRL, mouse_down, layoutmsg, colresize +conf
bind = $mainMod CTRL, mouse_up, layoutmsg, colresize -conf

# Scroll through existing workspaces with ALT + scroll
bind = ALT SHIFT, mouse_down, workspace, e+1
bind = ALT SHIFT, mouse_up, workspace, e-1

bind = , F1, exec, $default_wall

bind = , F3, exec, qs -c shell ipc call brightness set 100

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

bind = , F4, exec, $setup-workspace

## these are basicaly used in laptop
# bind = , F5, exec, swayosd-client --brightness -5
# bind = , F6, exec, swayosd-client --brightness +5

# Shima brightness service (DDC/CI for the HP HDMI monitor)
bind = , F5, exec, qs -c shell ipc call brightness decrement
bind = , F6, exec, qs -c shell ipc call brightness increment
bind = $mainMod, F5, exec, ~/.config/hypr/scripts/monitor contrast down
bind = $mainMod, F6, exec, ~/.config/hypr/scripts/monitor contrast up
bind = $mainMod SHIFT, F5, exec, ~/.config/hypr/scripts/monitor input next

# F-keys: F8/F9 speaker volume (SHIMA OSD), F10 USB mic mute,
# F11 media play/pause. bindel repeats on hold.
bindel = , F9, exec, qs -c shell ipc call audio volumeUp
bindel = , F8, exec, qs -c shell ipc call audio volumeDown
bindl = , F10, exec, $HOME/.config/hypr/scripts/input-mute-toggle
bindl = , F11, exec, qs -c shell ipc call mpris playPause; qs -c shell ipc call osd media play

# Media keys via Shima (MPRIS) + island now-playing OSD
bindl = , XF86AudioNext, exec, qs -c shell ipc call mpris next; sleep 0.2; qs -c shell ipc call osd media next
bindl = , XF86AudioPause, exec, qs -c shell ipc call mpris playPause; qs -c shell ipc call osd media pause
bindl = , XF86AudioPlay, exec, qs -c shell ipc call mpris playPause; qs -c shell ipc call osd media play
bindl = , XF86AudioPrev, exec, qs -c shell ipc call mpris previous; sleep 0.2; qs -c shell ipc call osd media previous

# wayland-boomer for zoomer
bind = $mainMod, Z, exec, grim - | wayland-boomer

# Rotate active monitor - closest Hyprland has to "rotate active window" (rotates whole monitor the window is on)
# SUPER+ALT+R = cycle, SUPER+ALT+SHIFT+R = reset (CTRL+ALT+R also works, avoids Noctalia flicker)
bind = SUPER ALT, R, exec, ~/.config/hypr/scripts/rotate-active-monitor next
bind = SUPER ALT SHIFT, R, exec, ~/.config/hypr/scripts/rotate-active-monitor reset
bind = CTRL ALT, R, exec, ~/.config/hypr/scripts/rotate-active-monitor next
bind = CTRL ALT SHIFT, R, exec, ~/.config/hypr/scripts/rotate-active-monitor reset

# E-ink paper mode toggle
bind = $mainMod SHIFT, E, exec, ~/.config/hypr/scripts/eink-toggle

# Opacity Controls
bind = $mainMod, bracketleft, exec, hyprctl dispatch setprop active opacity 0.70
bind = $mainMod, O, exec, $HOME/.config/hypr/scripts/toggle_opacity
