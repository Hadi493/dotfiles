###################
### KEYBINDINGS ###
###################


bind = ,XF86AudioMute, exec, noctalia msg volume-mute

# See https://wiki.hypr.land/Configuring/Keywords/
$mainMod = SUPER # Sets "Windows" key as main modifier

# Example binds, see https://wiki.hypr.land/Configuring/Binds/ for more
bind = $mainMod, Return, exec, $herdr
bind = $mainMod SHIFT, Return, exec, $terminal
bind = $mainMod, Q, killactive,
bind = $mainMod SHIFT, M, exit,
# bind = ALT, M, exec, $toggle_microphone
bind = $mainMod, A, exec, $audiosettings
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, Space, togglefloating,
bind = $mainMod, D, exec, noctalia msg panel-toggle launcher
bind = $mainMod SHIFT, D, exec, $discord
bind = ALT SHIFT, D, exec, $discord-web
bind = ALT, T, exec, $telegram
bind = ALT, R, exec, $reddit
bind = $mainMod SHIFT, A, exec, $tmenu
bind = ALT, F, exec, $facebook
bind = $mainMod SHIFT, W, exec, $whatsapp
bind = $mainMod, Y, exec, $yt
bind = $mainMod, T, exec, $twitch
bind = $mainMod, B, exec, brave-origin
bind = $mainMod, P, exec, $colorPicker | wl-copy
bind = $mainMod, U, exec, ~/.config/hypr/scripts/url_launcher_gui.py
# bind = $mainMod, J, togglesplit, # dwindle
bind = SUPER, F, fullscreen

bind = $mainMod, L, exec, hyprlock

bind = $mainMod, N, exec, noctalia msg panel-toggle control-center notifications

bind = $mainMod, C, exec, $codeditor

# CLock
bind = ALT, C, exec, kitty peaclock

# Grouped (tabbed) layout
bind = $mainMod, G, togglegroup

# switch windows in tab group
bind = CTRL, left, changegroupactive, b
bind = CTRL, right, changegroupactive, f
bind = ALT, Tab, changegroupactive, b

bind = $mainMod, Z, exec, coomer


# Clipboard
bind = SUPER, V, exec, noctalia msg panel-toggle clipboard

# Screen recording toggle
bind = $mainMod, R, exec, ~/.config/hypr/scripts/toggle_recording

# timer
bind = $mainMod, t, exec, cg-timer

# Direct Power Controls
bind = $mainMod SHIFT, R, exec, hyprctl --batch "reload ; keyword general:layout scrolling" ; ~/.config/hypr/scripts/hotcorner &
bind = $mainMod SHIFT, P, exec, systemctl poweroff

bind = ALT, R, exec, hyprctl keyword decoration:rounding 20

# Quick System Controls
bind = $mainMod, M, exec, noctalia msg volume-mute

# wallpaper
bind = $mainMod, W, exec, $wallpaper_selector

# Screenshot a window
bind = $mainMod, PRINT, exec, hyprshot -m window -o ~/Pictures/screenshots -f $(date +%Y-%m-%d_%H-%M-%S).png

# Screenshot a monitor
bind = , PRINT, exec, flameshot gui

bind = SHIFT, PRINT, exec, hyprshot -m region -o ~/Pictures/screenshots -f $(date +%Y-%m-%d_%H-%M-%S).png

bind = Ctrl, Escape, exec, noctalia msg bar-toggle # toggle bar
bind = SUPER, ESCAPE, exec, noctalia msg panel-toggle session

# Focus navigation (wraps first↔last in scrolling layout)
bind = $mainMod, left, layoutmsg, focus l
bind = $mainMod, right, layoutmsg, focus r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Move windows with mainMod + SHIFT + arrow keys
bind = $mainMod SHIFT, left, movewindow, l
bind = $mainMod SHIFT, right, movewindow, r
bind = $mainMod SHIFT, up, layoutmsg, focus u
bind = $mainMod SHIFT, down, layoutmsg, focus d

# Scrolling layout keybindings
bind = $mainMod, period, layoutmsg, move +col
bind = $mainMod, comma, layoutmsg, move -col
bind = $mainMod SHIFT, period, layoutmsg, swapcol r
bind = $mainMod SHIFT, comma, layoutmsg, swapcol l
bind = $mainMod SHIFT, bracketright, layoutmsg, promote
bind = $mainMod ALT, period, layoutmsg, colresize +conf
bind = $mainMod ALT, comma, layoutmsg, colresize -conf
bind = $mainMod, backslash, layoutmsg, fit active

# Resize windows with mainMod + CTRL + arrow keys
bind = $mainMod CTRL, left, resizeactive, -20 0
bind = $mainMod CTRL, right, resizeactive, 20 0
bind = $mainMod CTRL, up, resizeactive, 0 -20
bind = $mainMod CTRL, down, resizeactive, 0 20

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Switch workspaces with mainMod + arrow keys
bind = $mainMod, down, workspace, e+1
bind = $mainMod, up, workspace, e-1
bind = $mainMod, Tab, workspace, e-1

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Session app
bind = ALT, S, exec, ~/opt/squashfs-root/AppRun

# scrolloverview
bind = $mainMod, S, scrolloverview:overview, toggle
bind = $mainMod, i, scrolloverview:navigate, up
bind = $mainMod, k, scrolloverview:navigate, down
bind = $mainMod, h, scrolloverview:navigate, left
bind = $mainMod, l, scrolloverview:navigate, right
bind = $mainMod, Return, scrolloverview:overview, select

# Example special workspace (scratchpad)
# bind = $mainMod, S, togglespecialworkspace, magic
# bind = $mainMod SHIFT, S, movetoworkspace, special:magic

# Touchpad swipe gestures for workspace switching (niri-like)
bind = , swipe:3:left, workspace, e+1
bind = , swipe:3:right, workspace, e-1

# Scroll through columns with mainMod + scroll (niri-like)
bind = $mainMod, mouse_down, layoutmsg, move +col
bind = $mainMod, mouse_up, layoutmsg, move -col
bind = $mainMod SHIFT, mouse_down, layoutmsg, swapcol r
bind = $mainMod SHIFT, mouse_up, layoutmsg, swapcol l
bind = $mainMod CTRL, mouse_down, layoutmsg, colresize +conf
bind = $mainMod CTRL, mouse_up, layoutmsg, colresize -conf

# Scroll through existing workspaces with ALT + scroll
bind = ALT, mouse_down, workspace, e+1
bind = ALT, mouse_up, workspace, e-1

bind = , F1, exec, $default_wall

bind = , F3, exec, brightnessctl set 100%+

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

bind = , F4, exec, $setup-workspace

## these are basicaly used in laptop
# bind = , F5, exec, swayosd-client --brightness -5
# bind = , F6, exec, swayosd-client --brightness +5

# for HP HDMI monitor (DDC/CI)
bind = , F5, exec, ~/.config/hypr/scripts/monitor brightness down
bind = , F6, exec, ~/.config/hypr/scripts/monitor brightness up
bind = $mainMod, F5, exec, ~/.config/hypr/scripts/monitor contrast down
bind = $mainMod, F6, exec, ~/.config/hypr/scripts/monitor contrast up
bind = $mainMod SHIFT, F5, exec, ~/.config/hypr/scripts/monitor input next

# Laptop multimedia keys for volume and LCD brightness
bind = , F9, exec, noctalia msg volume-up
bind = , F8, exec, noctalia msg volume-down
# bind = , F10, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle && notify-send -u normal -t 1000 "Michrophone" "toggled"
bind = , F10, exec, $HOME/.config/hypr/scripts/input-mute-toggle
bind = , F7, exec, noctalia msg mic-volume-down
bind = , F12, exec, noctalia msg mic-volume-up
bind = , F11, exec, noctalia msg media toggle

# Media keys via Noctalia (MPRIS)
bindl = , XF86AudioNext, exec, noctalia msg media next
bindl = , XF86AudioPause, exec, noctalia msg media toggle
bindl = , XF86AudioPlay, exec, noctalia msg media toggle
bindl = , XF86AudioPrev, exec, noctalia msg media previous

# wayland-boomer for zoomer
bind = $mainMod, Z, exec, grim - | wayland-boomer

# Opacity Controls
bind = $mainMod, bracketleft, exec, hyprctl dispatch setprop active opacity 0.70
bind = $mainMod, O, exec, $HOME/.config/hypr/scripts/toggle_opacity
