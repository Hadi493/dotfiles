#############
### INPUT ###
#############

# https://wiki.hypr.land/Configuring/Variables/#input
input {
    kb_layout = us
    kb_variant =
    kb_model =
    kb_options =
    kb_rules =

    follow_mouse = 1

    repeat_rate = 60
    repeat_delay = 300

    sensitivity = 1.0 # -1.0 - 1.0, 0 means no modification.

    # touchpad {
    #     natural_scroll = true
    # }
}

plugin {
    scrolloverview {
        gesture_distance = 300
        scale = 0.5
        workspace_gap = 10
        layout = vertical
        wallpaper = 0
        blur = false

        input {
            scrolling_mode = 2   # vertical scroll = workspace, horizontal scroll = columns
            drag_mode = 1        # main button pans, middle button drags windows
            drag_threshold = 10
            touchpad_scroll_factor = 1
            scroll_event_delay = 200
        }

        shadow {
            enabled = false
        }
    }
}

# See https://wiki.hypr.land/Configuring/Gestures

# Example per-device config
# See https://wiki.hypr.land/Configuring/Keywords/#per-device-input-configs for more
device {
    name = epic-mouse-v1
    sensitivity = 1.0
}
