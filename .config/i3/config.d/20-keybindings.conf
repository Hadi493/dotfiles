# --- Keybindings ---

# Programs (from hypr branch variables.conf)
set $terminal kitty
set $audiosettings pavucontrol
set $codeditor emacs
set $fileManager nautilus
set $menu rofi -show drun -config ~/.config/rofi/drun.rasi
set $wallpaper_selector ~/.config/i3/scripts/wallpaper_select.sh
set $discord discord
set $telegram Telegram
set $reddit brave-origin --profile-directory=Default --app=https://reddit.com
set $facebook brave-origin --profile-directory=Default --app=https://facebook.com
set $whatsapp brave-origin --profile-directory=Default --app=https://web.whatsapp.com
set $yt brave-origin --profile-directory=Default --app=https://youtube.com
set $twitch brave-origin --profile-directory=Default --app=https://www.twitch.tv/
set $colorPicker xcolor | wl-copy
set $setup_workspace ~/.config/i3/scripts/workspace-setup.sh

# Media keys (playerctl)
bindsym XF86AudioNext exec --no-startup-id playerctl next
bindsym XF86AudioPause exec --no-startup-id playerctl play-pause
bindsym XF86AudioPlay exec --no-startup-id playerctl play-pause
bindsym XF86AudioPrev exec --no-startup-id playerctl previous

# Audio (pactl)
bindsym XF86AudioRaiseVolume exec --no-startup-id pactl set-sink-volume @DEFAULT_SINK@ +10%
bindsym XF86AudioLowerVolume exec --no-startup-id pactl set-sink-volume @DEFAULT_SINK@ -10%
bindsym XF86AudioMute exec --no-startup-id pactl set-sink-mute @DEFAULT_SINK@ toggle
bindsym XF86AudioMicMute exec --no-startup-id pactl set-source-mute @DEFAULT_SOURCE@ toggle

# Brightness
bindsym F3 exec --no-startup-id brightnessctl set 100%+
bindsym F5 exec --no-startup-id ~/.config/i3/scripts/brightness.sh down
bindsym F6 exec --no-startup-id ~/.config/i3/scripts/brightness.sh up

# Audio (wpctl) - F8/F9/F10
bindsym F8 exec --no-startup-id wpctl set-volume @DEFAULT_AUDIO_SINK@ 2%-
bindsym F9 exec --no-startup-id wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 2%+
bindsym F10 exec --no-startup-id ~/.config/i3/scripts/input-mute-toggle.sh

# Night mode
bindsym F1 exec --no-startup-id killall gammastep || gammastep -O 3500

# Workspace setup
bindsym F4 exec --no-startup-id $setup_workspace

# Screenshots (ksnip — GUI with annotation tools like flameshot)
bindsym $mod+Shift+s exec --no-startup-id QT_QPA_PLATFORMTHEME=qt6ct ksnip -f
bindsym Print exec --no-startup-id QT_QPA_PLATFORMTHEME=qt6ct ksnip -r

# Apps (matching hypr keybinds)
bindsym $mod+Return exec $terminal
bindsym $mod+q kill
bindsym $mod+f fullscreen toggle
bindsym $mod+space floating toggle
bindsym $mod+d exec --no-startup-id $menu
bindsym $mod+e exec $fileManager
bindsym $mod+c exec $codeditor
bindsym $mod+b exec --no-startup-id brave-origin
bindsym $mod+y exec --no-startup-id $yt
bindsym $mod+t exec --no-startup-id $twitch
bindsym $mod+a exec --no-startup-id $audiosettings
bindsym $mod+w exec --no-startup-id $wallpaper_selector
bindsym $mod+p exec $colorPicker
bindsym $mod+z exec boomer
bindsym $mod+l exec --no-startup-id ~/.config/i3/scripts/lock.sh
bindsym $mod+s exec --no-startup-id ~/opt/squashfs-root/AppRun
bindsym $mod+o exec --no-startup-id ~/.config/i3/scripts/toggle_opacity.sh
bindsym $mod+r exec --no-startup-id ~/.config/i3/scripts/toggle_recording.sh
bindsym $mod+bracketleft exec --no-startup-id picom-trans -c 0.70
bindsym $mod+v exec --no-startup-id ~/.config/i3/scripts/clipboard.sh clip

# Chat / Web apps
bindsym $mod+Shift+d exec --no-startup-id $discord
bindsym $mod+Shift+w exec --no-startup-id $whatsapp
bindsym $mod+Shift+v exec --no-startup-id ~/.config/i3/scripts/clipboard.sh pass
bindsym $spr+t exec --no-startup-id $telegram
bindsym $spr+r exec --no-startup-id $reddit
bindsym $spr+f exec --no-startup-id $facebook

# Clock / Timer
bindsym $spr+c exec --no-startup-id kitty --class peaclock -e peaclock
bindsym $mod+Shift+t exec --no-startup-id /usr/bin/cg-timer

# Focus (arrow keys)
bindsym $mod+Left focus left
bindsym $mod+Down focus down
bindsym $mod+Up focus up
bindsym $mod+Right focus right
bindsym $spr+Tab focus prev

# Move windows
bindsym $mod+Shift+Left move left
bindsym $mod+Shift+Down move down
bindsym $mod+Shift+Up move up
bindsym $mod+Shift+Right move right

# System
bindsym $mod+Shift+c reload
bindsym $mod+Shift+r restart
bindsym $mod+Shift+e exec "i3-nagbar -t warning -m 'You pressed the exit shortcut. Do you really want to exit i3? This will end your X session.' -B 'Yes, exit i3' 'i3-msg exit'"
bindsym $mod+Shift+p exec --no-startup-id systemctl poweroff

# Polybar toggle
bindsym Ctrl+Escape exec --no-startup-id sh -c 'killall polybar || polybar'

# Opacity controls
bindsym $mod+equal exec --no-startup-id picom-trans -c +5
bindsym $mod+minus exec --no-startup-id picom-trans -c -5
