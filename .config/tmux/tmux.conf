# =============================================================================
# Gruber-Darker-Ayu Tmux Configuration
# =============================================================================

# -------------------------------------------------------------------
# General Settings
# -------------------------------------------------------------------
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"
set -ga terminal-overrides '*:Ss=\E[%p1%d q:Se=\E[ q'
set -g escape-time 0
set -g history-limit 50000
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on
set -g display-time 4000
set -g status-interval 5
set -g status-justify centre
set -g mouse on
set -g focus-events on
set -g set-clipboard on
set -g detach-on-destroy off
set -g default-command "$SHELL"

# -------------------------------------------------------------------
# Cache & Performance
# -------------------------------------------------------------------
set -g aggressive-resize on
set -g renumber-windows on
set -g set-titles on
set -g set-titles-string "#S:#I:#W"

# -------------------------------------------------------------------
# Gruber-Darker-Ayu Theme
# -------------------------------------------------------------------
# Palette (from emacs gruber-darker-ayu-theme):
#   bg      #181818  background
#   bg-1    #0d0d0d  darker bg (status bg)
#   bg+1    #1c1c2a  lighter bg
#   bg+2    #2a2a3e  selection bg
#   bg+3    #363652  region / inactive
#   fg      #ffffff  foreground
#   gray    #6B7B8E  muted text
#   gold    #E6B450  primary accent
#   func    #FFD064  active / keyword
#   green   #C5E665  strings
#   blue    #6DCFFF  types / links
#   purple  #E0B8FF  special
#   red     #FF7B85  errors / bells
#   cyan    #4AC8E6  operators / activity
#   comment #95a99f  secondary text
#   orange  #FF9944  warnings
#   peach   #FFA375  redirections
#   teal    #A8F0D8  misc

# Messages
set -g message-style "fg=#ffffff,bg=#2a2a3e"
set -g message-command-style "fg=#ffffff,bg=#363652"
set -g mode-style "fg=#181818,bg=#FFD064"

# Pane borders
set -g pane-border-style "fg=#2a2a3e,bg=#181818"
set -g pane-active-border-style "fg=#E6B450,bg=#181818"
set -g display-panes-colour "#E6B450"
set -g display-panes-active-colour "#FFD064"

# Status line
set -g status-style "fg=#ffffff,bg=#0d0d0d"

# Left segment — session name
set -g status-left "#[fg=#181818,bg=#E6B450] #S "
set -g status-left-length 40

# Right segment — host · time · date
set -g status-right "#[fg=#6B7B8E]#H #[fg=#2a2a3e]│#[fg=#95a99f]%H:%M #[fg=#2a2a3e]│#[fg=#6B7B8E]%d-%b-%y"
set -g status-right-length 80

# Window list
set -g window-status-format "#[fg=#6B7B8E] #I:#W "
set -g window-status-current-format "#[fg=#181818,bg=#FFD064] #I:#W"
set -g window-status-separator " "
set -g window-status-activity-style "fg=#4AC8E6,bg=#0d0d0d"
set -g window-status-bell-style "fg=#FF7B85,bold,bg=#0d0d0d"
set -g window-status-last-style "fg=#E6B450,bg=#0d0d0d"

# -------------------------------------------------------------------
# Keybindings
# -------------------------------------------------------------------

# --- Prefix ---
set -g prefix C-b
set -g prefix2 C-a

# Reload config
bind r source-file ~/.config/tmux/tmux.conf \; display "Config reloaded!"

# --- Splitting ---
bind | split-window -h -c "#{pane_current_path}"
bind \\ split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind _ split-window -v -c "#{pane_current_path}"

# --- Pane Navigation (Vim) ---
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Alt-arrows for direct pane navigation (no prefix)
bind -n M-Left  select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up    select-pane -U
bind -n M-Down  select-pane -D

# --- Resize ---
bind H resize-pane -L 5
bind J resize-pane -D 5
bind K resize-pane -U 5
bind L resize-pane -R 5

bind -r C-Left  resize-pane -L 2
bind -r C-Down  resize-pane -D 2
bind -r C-Up    resize-pane -U 2
bind -r C-Right resize-pane -R 2

# --- Windows ---
bind c new-window -c "#{pane_current_path}"
bind C new-window -c "#{pane_current_path}"
bind w choose-window
bind W choose-tree -w
bind , command-prompt -I "#W" { rename-window -- "%%" }
bind . command-prompt -I "#S" { rename-session -- "%%" }
bind Tab last-window
bind = choose-buffer

# --- Sessions ---
bind s choose-tree -Zs
bind S new-session -c "#{pane_current_path}"

# --- Panes ---
bind x kill-pane
bind q kill-pane
bind Q kill-window
bind X kill-session
bind ! break-pane
bind z resize-pane -Z
bind { swap-pane -U
bind } swap-pane -D
bind M-o rotate-window

# Toggle mouse
bind m set -g mouse \; display "Mouse #{?mouse,on,off}"

# Synchronize panes
bind y setw synchronize-panes \; display "Sync #{?synchronize-panes,on,off}"

# Clear scrollback
bind -n M-c clear-history \; display "History cleared!"

# --- Copy Mode (Vi) ---
bind Enter copy-mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi Y send -X copy-line
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi r send -X rectangle-toggle
bind -T copy-mode-vi Escape send -X cancel
bind -T copy-mode-vi C-c send -X cancel
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-selection-and-cancel

# --- F-Keys ---
bind -n F5 source-file ~/.config/tmux/tmux.conf \; display "Config reloaded!"

# --- Popup (tmux 3.2+) ---
bind M-p display-popup -E
bind M-P display-popup -hWR -E

# -------------------------------------------------------------------
# Mode Settings
# -------------------------------------------------------------------
set -g mode-keys vi
set -g clock-mode-style 24

# -------------------------------------------------------------------
# Plugins (TPM)
# -------------------------------------------------------------------
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-yank'

# Resurrect / Continuum
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-vim 'session'
set -g @resurrect-dir '~/.local/share/tmux/resurrect'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

# Yank
set -g @yank-selection 'primary'
set -g @yank-with-mouse 'on'

# Initialize TPM (must be last)
run '~/.config/tmux/plugins/tpm/tpm'
