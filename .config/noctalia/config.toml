# config.toml — MDS entry point
# Minimal entry that includes modular files.
# Update design any time by editing modules/*.toml — no full rewrite needed.
# See modules/ for theme, bar, widgets, system.

[include]
autoload = false
files = [
  "modules/00-theme.toml",
  "modules/10-bar.toml",
  "modules/20-widgets.toml",
  "modules/30-system.toml",
]
