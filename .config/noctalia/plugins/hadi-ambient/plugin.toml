id         = "hadi/ambient"
name       = "Ambient Sounds"
version    = "2.0.0"
plugin_api = 23
author     = "hadi"
description = "Dynamic background sound loops — bundled rain loops plus your own audio files or URLs."
icon       = "wave-sine"
tags       = ["audio", "ambient", "background"]
dependencies = ["mpv"]

[[service]]
id    = "service"
entry = "service.luau"

[[widget]]
id    = "ambient"
entry = "widget.luau"
  [widget.actions]
  middle = "none"

[[shortcut]]
id    = "ambient-tile"
entry = "shortcut.luau"

[[panel]]
id    = "ambient-panel"
entry = "panel.luau"
width = 400
height = 620
placement = "floating"
position = "center"
open_near_click = false
dismiss_on_outside_click = true

[[setting]]
key = "default_sound"
type = "string"
label_key = "settings.default_sound.label"
description_key = "settings.default_sound.description"
default = "rain"

[[setting]]
key = "volume"
type = "double"
label_key = "settings.volume.label"
description_key = "settings.volume.description"
default = 0.32
min = 0.0
max = 1.0

[[setting]]
key = "auto_play"
type = "bool"
label_key = "settings.auto_play.label"
description_key = "settings.auto_play.description"
default = false

[[setting]]
key = "allow_multiple"
type = "bool"
label_key = "settings.allow_multiple.label"
description_key = "settings.allow_multiple.description"
default = false
